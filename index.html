  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Manrope:wght@500;600;700&display=swap');

    :root {
      --page: #e9f6f7;
      --ink: #07141a;
      --muted: #405b63;
      --card: rgba(255, 255, 255, .82);
      --line: rgba(3, 105, 125, .22);
      --cyan: #00aeca;
      --lime: #79c900;
      --orange: #ff9e1a;
      --button-ink: #031014;
      --grid: rgba(0, 141, 166, .1);
      --glow: rgba(0, 174, 202, .28);
      --shadow: 0 24px 70px rgba(2, 56, 67, .18), 0 5px 18px rgba(2, 56, 67, .12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #03080d;
        --ink: #f1fdff;
        --muted: #9ab5bd;
        --card: rgba(7, 20, 27, .82);
        --line: rgba(57, 224, 255, .2);
        --cyan: #1bdcf7;
        --lime: #b6f34b;
        --orange: #ffb138;
        --button-ink: #031014;
        --grid: rgba(27, 220, 247, .09);
        --glow: rgba(27, 220, 247, .28);
        --shadow: 0 28px 90px rgba(0, 0, 0, .48), 0 6px 24px rgba(0, 0, 0, .3);
      }
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--page);
      font-family: "Manrope", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .arena {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--cyan) 19%, transparent), transparent 25rem),
        radial-gradient(circle at 85% 72%, color-mix(in srgb, var(--orange) 13%, transparent), transparent 28rem),
        linear-gradient(155deg, color-mix(in srgb, var(--page) 94%, var(--cyan)) 0%, var(--page) 56%, color-mix(in srgb, var(--page) 94%, var(--orange)) 100%);
    }

    .arena::before {
      content: "";
      position: absolute;
      inset: -70%;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 46px 46px;
      transform: perspective(700px) rotateX(62deg) rotateZ(-9deg);
      animation: grid-drift 13s linear infinite;
      mask-image: linear-gradient(to bottom, transparent 14%, #000 48%, transparent 78%);
    }

    .scanline {
      position: absolute;
      inset: -20% 0 auto;
      height: 28%;
      background: linear-gradient(transparent, color-mix(in srgb, var(--cyan) 7%, transparent), transparent);
      animation: scan 8s linear infinite;
    }

    .pixel {
      position: absolute;
      width: 9px;
      aspect-ratio: 1;
      color: var(--cyan);
      opacity: .48;
      background: currentColor;
      box-shadow: 15px 0 currentColor, 30px 0 currentColor, 0 15px currentColor, 30px 15px currentColor, 0 30px currentColor, 15px 30px currentColor, 30px 30px currentColor;
      animation: float 8s ease-in-out infinite;
    }

    .pixel.one { left: 8%; top: 18%; transform: scale(.75); }
    .pixel.two { right: 12%; top: 28%; color: var(--lime); animation-delay: -3s; transform: scale(.55) rotate(45deg); }
    .pixel.three { left: 14%; bottom: 16%; color: var(--orange); animation-delay: -5s; transform: scale(.45); }

    .controller {
      position: absolute;
      width: 130px;
      height: 80px;
      opacity: .12;
      color: var(--cyan);
      animation: controller-float 9s ease-in-out infinite;
    }

    .controller.left { left: max(-28px, calc(50% - 470px)); top: 19%; transform: rotate(-18deg); }
    .controller.right { right: max(-30px, calc(50% - 470px)); bottom: 17%; color: var(--orange); animation-delay: -4s; transform: rotate(17deg); }

    .page {
      width: min(100%, 610px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: max(34px, env(safe-area-inset-top)) 22px max(30px, env(safe-area-inset-bottom));
      display: grid;
      align-content: center;
    }

    .profile {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar-wrap {
      position: relative;
      width: clamp(142px, 34vw, 190px);
      aspect-ratio: 1;
      margin: 0 auto 20px;
    }

    .avatar-wrap::before,
    .avatar-wrap::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .avatar-wrap::before {
      inset: -8px;
      border: 3px solid transparent;
      border-top-color: var(--cyan);
      border-right-color: var(--lime);
      border-bottom-color: var(--orange);
      filter: drop-shadow(0 0 10px var(--glow));
      animation: orbit 8s linear infinite;
    }

    .avatar-wrap::after {
      inset: -17px;
      border: 1px dashed color-mix(in srgb, var(--cyan) 45%, transparent);
      animation: orbit 14s linear infinite reverse;
    }

    .avatar {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid color-mix(in srgb, var(--page) 72%, transparent);
      box-shadow: 0 0 0 1px var(--line), 0 18px 45px rgba(0,0,0,.28);
    }

    h1 {
      margin: 0;
      font: 800 clamp(52px, 13vw, 82px)/.82 "Barlow Condensed", sans-serif;
      letter-spacing: -.035em;
      text-transform: none;
      text-shadow: 0 0 22px var(--glow);
    }

    .tagline {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .tagline::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--lime) 14%, transparent), 0 0 14px var(--lime);
      animation: pulse 2s ease-in-out infinite;
    }

    .link-card {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 17px;
      align-items: center;
      width: 100%;
      min-height: 108px;
      padding: 19px 20px;
      overflow: hidden;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(14px);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .link-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 0 42%, color-mix(in srgb, var(--cyan) 9%, transparent) 50%, transparent 58% 100%);
      transform: translateX(-120%);
      animation: shine 5s ease-in-out infinite;
    }

    .mark {
      position: relative;
      z-index: 1;
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      color: var(--button-ink);
      background: linear-gradient(135deg, var(--cyan), var(--lime));
      clip-path: polygon(12% 0, 88% 0, 100% 12%, 100% 88%, 88% 100%, 12% 100%, 0 88%, 0 12%);
      box-shadow: 0 0 24px var(--glow);
    }

    .mark svg { width: 34px; height: 34px; }
    .copy { position: relative; z-index: 1; min-width: 0; text-align: left; }

    .copy strong {
      display: block;
      margin-bottom: 4px;
      font: 800 clamp(23px, 5vw, 28px)/1 "Barlow Condensed", sans-serif;
      letter-spacing: .01em;
    }

    .copy span { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; }

    .arrow {
      position: relative;
      z-index: 1;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: color-mix(in srgb, var(--page) 68%, transparent);
      transition: transform .2s ease, background .2s ease;
    }

    .arrow svg { width: 19px; height: 19px; }

    .link-card:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--cyan) 62%, var(--line));
      box-shadow: 0 30px 90px rgba(0, 101, 121, .22), 0 0 30px var(--glow);
    }

    .link-card:hover .arrow,
    .link-card:focus-visible .arrow { transform: translateX(4px); background: color-mix(in srgb, var(--lime) 28%, var(--page)); }

    .link-card:focus-visible { outline: 3px solid color-mix(in srgb, var(--cyan) 62%, transparent); outline-offset: 5px; }

    .note { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: 12px; }

    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes grid-drift { to { transform: perspective(700px) rotateX(62deg) rotateZ(-9deg) translate3d(46px, 46px, 0); } }
    @keyframes scan { to { transform: translateY(560%); } }
    @keyframes float { 0%, 100% { translate: 0 -8px; opacity: .24; } 50% { translate: 0 16px; opacity: .56; } }
    @keyframes controller-float { 0%, 100% { translate: 0 -10px; } 50% { translate: 8px 14px; } }
    @keyframes pulse { 50% { opacity: .55; transform: scale(.85); } }
    @keyframes shine { 0%, 65% { transform: translateX(-120%); } 88%, 100% { transform: translateX(120%); } }

    @media (max-width: 430px) {
      .page { padding-inline: 18px; }
      .profile { margin-bottom: 24px; }
      .link-card { gap: 14px; min-height: 96px; padding: 16px; border-radius: 15px; }
      .mark { width: 55px; height: 55px; }
      .mark svg { width: 30px; height: 30px; }
      .arrow { width: 36px; height: 36px; }
      .controller { width: 90px; height: 56px; }
    }

    @media (max-width: 340px) {
      .link-card { grid-template-columns: auto 1fr; }
      .arrow { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; }
      .link-card, .arrow { transition: none; }
    }
  </style>
</head>
